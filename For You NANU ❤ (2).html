<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You NANU ❤️</title>
<style>
:root{--bg:#ffe3ec;--card:#fff;--ink:#4a2c2a;--pink:#ff6b9d;--soft:#ffc2d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#3a2030;--ink:#ffe9f0;--soft:#7a3a55}}
:root[data-theme="dark"]{--bg:#2a1620;--card:#3a2030;--ink:#ffe9f0;--soft:#7a3a55}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive,sans-serif;text-align:center;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.7rem;margin:8px 0}h2{font-size:1.3rem;margin:6px 0}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);padding:18px;margin:16px 0}
.bear{width:230px;max-width:70%;height:auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.btns{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:90px;margin-top:10px}
button{font:inherit;font-weight:700;color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s;background:var(--soft)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
#yes{background:var(--pink);color:#fff;font-size:1.1rem}
#menu{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
#menu button{border-radius:20px;padding:14px 8px;font-size:1rem}
p{line-height:1.5;margin:.6em 0}
.reasons{list-style:none;padding:0;margin:10px 0;text-align:left}
.reasons li{background:var(--soft);border-radius:16px;padding:8px 12px;margin:8px 0}
.scene{width:100%;max-width:340px;height:auto}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.frame{background:#fff;color:#4a2c2a;border:3px solid var(--ink);border-radius:10px;padding:8px 8px 4px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transform:rotate(-2deg)}
.frame:nth-child(even){transform:rotate(2deg)}
.frame .ph{aspect-ratio:1/1;border-radius:6px;background:#ffe3ec center/cover;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.frame small{display:block;font-size:.8rem;padding:4px 0}
.quote{font-size:1.2rem;font-weight:700;min-height:7em;display:flex;align-items:center;justify-content:center;padding:6px}
.heart{position:fixed;bottom:-40px;z-index:0;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
/* popups */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(40,10,25,.55);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov.on{display:flex}
.pop{position:relative;width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);padding:22px 18px 20px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-4deg);opacity:0}}
.x{position:absolute;top:8px;right:8px;width:40px;height:40px;padding:0;border-radius:50%;font-size:1.1rem;background:var(--pink);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.bubble{font-size:1.25rem;font-weight:700;text-align:center;max-width:320px}
.bubble .big{font-size:3rem;display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Hey <span class="her">NANU</span> ❤️… 🥺</h1>
  <div class="card">
    <svg class="bear" viewBox="0 0 200 200" aria-label="Cartoon bear">
      <g stroke="#4a2c2a" stroke-width="4" stroke-linecap="round">
        <circle cx="48" cy="52" r="28" fill="#c98b5e"/><circle cx="48" cy="52" r="13" fill="#ffc2d6" stroke="none"/>
        <circle cx="152" cy="52" r="28" fill="#c98b5e"/><circle cx="152" cy="52" r="13" fill="#ffc2d6" stroke="none"/>
        <circle cx="100" cy="108" r="72" fill="#c98b5e"/>
        <ellipse cx="100" cy="128" rx="30" ry="22" fill="#ffe9cf"/>
        <ellipse cx="100" cy="118" rx="9" ry="6" fill="#4a2c2a"/>
        <circle cx="73" cy="98" r="8" fill="#4a2c2a"/><circle cx="127" cy="98" r="8" fill="#4a2c2a"/>
        <circle cx="70" cy="95" r="2.5" fill="#fff" stroke="none"/><circle cx="124" cy="95" r="2.5" fill="#fff" stroke="none"/>
        <ellipse cx="55" cy="122" rx="11" ry="7" fill="#ff6b9d" stroke="none" opacity=".7"/>
        <ellipse cx="145" cy="122" rx="11" ry="7" fill="#ff6b9d" stroke="none" opacity=".7"/>
        <path id="brow1" d="M62 80 L84 86" fill="none"/><path id="brow2" d="M138 80 L116 86" fill="none"/>
        <path id="mouth" d="M88 142 Q100 132 112 142" fill="none"/>
      </g>
      <path id="tear" d="M70 108 Q64 120 70 124 Q76 120 70 108Z" fill="#7ad7ff" stroke="#4a2c2a" stroke-width="2"/>
    </svg>
    <p id="msg" style="font-size:1.2rem;font-weight:700">Are you still a little mad at me, NANU?</p>
    <div class="btns" id="btns">
      <button id="no">Yes, a little 😤</button>
      <button id="yes">Forgive me 🥺💗</button>
    </div>
    <div id="menu">
      <button data-open="p-letter">💌 Love letter</button>
      <button data-open="p-quote">💘 Love notes</button>
      <button data-open="p-photos">📸 Our memories</button>
      <button data-open="p-hug">🎁 Surprise</button>
    </div>
  </div>
</div>

<!-- POPUPS -->
<div class="ov" id="p-letter"><div class="pop"><button class="x" data-close>✕</button>
  <h1>I love you, <span class="her">NANU</span> ❤️</h1>
  <p id="sorry"></p><ul class="reasons" id="reasons"></ul><p id="sign" style="font-weight:700"></p></div></div>

<div class="ov" id="p-quote"><div class="pop"><button class="x" data-close>✕</button>
  <h2>💌 A little note for you</h2><div class="quote" id="quote"></div>
  <button id="nextq">Next love note 💘</button></div></div>

<div class="ov" id="p-photos"><div class="pop"><button class="x" data-close>✕</button>
  <h2>📸 Our memories</h2><p style="font-size:.9rem;margin:0">Tap a frame to add a photo</p><div class="gal" id="gal"></div></div></div>

<div class="ov" id="p-hug"><div class="pop"><button class="x" data-close>✕</button>
  <svg class="scene" viewBox="0 0 340 200" aria-label="Two bears hugging">
    <g stroke="#4a2c2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170 60 C170 40 140 40 140 62 C140 80 170 96 170 100 C170 96 200 80 200 62 C200 40 170 40 170 60Z" fill="#ff6b9d" transform="translate(0,-10)"/>
      <ellipse cx="105" cy="165" rx="42" ry="30" fill="#c98b5e"/><ellipse cx="235" cy="165" rx="42" ry="30" fill="#e9a27a"/>
      <circle cx="82" cy="105" r="14" fill="#c98b5e"/><circle cx="128" cy="105" r="14" fill="#c98b5e"/><circle cx="105" cy="125" r="42" fill="#c98b5e"/>
      <circle cx="212" cy="105" r="14" fill="#e9a27a"/><circle cx="258" cy="105" r="14" fill="#e9a27a"/><circle cx="235" cy="125" r="42" fill="#e9a27a"/>
      <circle cx="92" cy="120" r="5" fill="#4a2c2a"/><circle cx="118" cy="120" r="5" fill="#4a2c2a"/><path d="M95 136 Q105 146 115 136" fill="none"/>
      <circle cx="222" cy="120" r="5" fill="#4a2c2a"/><circle cx="248" cy="120" r="5" fill="#4a2c2a"/><path d="M225 136 Q235 146 245 136" fill="none"/>
      <path d="M222 86 L235 96 L248 86 L248 100 L235 94 L222 100Z" fill="#ff6b9d"/>
      <path d="M140 160 Q170 190 200 160" fill="none"/>
    </g>
    <text x="40" y="60" font-size="26">🌸</text><text x="285" y="70" font-size="26">🌷</text><text x="20" y="150" font-size="22">✨</text><text x="300" y="160" font-size="22">✨</text>
  </svg>
  <div style="font-size:2.2rem">🎁🧸🌹🍫</div>
  <h2>A big, long hug is waiting for you, <span class="her">NANU</span> 🤗❤️</h2><p>Today, tomorrow, and always.</p></div></div>

<div class="ov" id="p-no"><div class="bubble pop" style="padding:24px"><span class="big" id="no-emoji">🥺</span><span id="no-text"></span></div></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
// ✏️ EDIT THESE:
var HER_NAME = "NANU";
var MY_NAME = "Me";
var SORRY = "I’m really sorry for upsetting you. You matter so much to me, and seeing you sad is the last thing I want. I’ll do better, listen more, and make it up to you. 💗";
var REASONS = ["You make my bad days better 🌈","Your smile is my favorite thing ever 😊","I’m so lucky you’re mine 🍀"];
var QUOTES = [
 "I may be wrong sometimes, but loving you is always right. ❤️",
 "You are my today and all of my tomorrows. 🌅",
 "Even when we fight, I would still choose you every single time. 💞",
 "Sorry is a small word, but my love for you is huge. 🧸",
 "Your hand in mine makes the whole world feel okay. 🤝",
 "If I had a flower for every time you crossed my mind, I’d walk in a garden forever. 🌸",
 "You are my favorite notification. 📱💗",
 "Being mad at me is cute, but your smile is cuter. 😊",
 "No matter how loud we get, my heart always whispers your name. 🥰",
 "You are the reason I believe in love. ✨",
 "Home is wherever you are, NANU. 🏡",
 "I promise to hug you more than I argue with you. 🤗"
];
var CAPS=["Us 💑","Best day ✨","My favorite 🥰","Forever 💍"];
var $=function(i){return document.getElementById(i)};
document.querySelectorAll(".her").forEach(function(e){e.textContent=HER_NAME});
$("sorry").textContent=SORRY;
$("reasons").innerHTML=REASONS.map(function(r){return "<li>"+r+"</li>"}).join("");
$("sign").textContent="Forever yours, "+MY_NAME+" 🧸💘";

function openP(id){document.querySelectorAll(".ov").forEach(function(o){o.classList.remove("on")});$(id).classList.add("on");hearts(6);}
function closeP(){document.querySelectorAll(".ov").forEach(function(o){o.classList.remove("on")});}
document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){openP(b.getAttribute("data-open"));if(b.getAttribute("data-open")=="p-quote")showQ();}});
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=closeP});
document.querySelectorAll(".ov").forEach(function(o){o.onclick=function(e){if(e.target===o&&o.id!="p-no")closeP();}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeP()});

var no=$("no"),yes=$("yes"),msg=$("msg"),n=0,tm;
var lines=[["🥺","Really?"],["🐻💧","But look at this sad bear…"],["😭","He made a tiny tear for you"],["🙈","Okay… maybe just a little less mad?"],["🙏","Please?"],["🤗","I’ll give you extra hugs"]];
function hearts(k){var em=["💖","💗","💕","💘","🧸","🌸","❤️"];
 for(var i=0;i<k;i++){var h=document.createElement("div");h.className="heart";h.textContent=em[i%em.length];
  h.style.left=Math.random()*95+"vw";h.style.fontSize=(18+Math.random()*28)+"px";h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);setTimeout(function(x){x.remove()},7500,h);}}
no.onclick=function(){n++;
 if(n>lines.length){no.style.display="none";msg.textContent="Okay, no more ‘no’ button! 😝";return}
 $("no-emoji").textContent=lines[n-1][0];$("no-text").textContent=lines[n-1][1];openP("p-no");
 clearTimeout(tm);tm=setTimeout(closeP,1800);
 no.style.transform="scale("+Math.max(.45,1-n*.1)+")";yes.style.transform="scale("+(1+n*.12)+")";};
$("p-no").onclick=function(){closeP()};
var qi=0;
function showQ(){$("quote").textContent=QUOTES[qi%QUOTES.length];}
$("nextq").onclick=function(){qi++;showQ();hearts(5);};
// photo frames (kept in this browser only)
var gal=$("gal"),fileIn=$("file"),cur=null;
CAPS.forEach(function(c,i){var f=document.createElement("div");f.className="frame";
 f.innerHTML='<div class="ph">📷</div><small>'+c+'</small>';gal.appendChild(f);
 try{var s=localStorage.getItem("nanu_p"+i);if(s){f.firstChild.style.backgroundImage="url("+s+")";f.firstChild.textContent="";}}catch(e){}
 f.onclick=function(){cur=i;fileIn.click();};});
fileIn.onchange=function(){var fl=fileIn.files[0];if(!fl||cur===null)return;var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),m=420,k=Math.min(1,m/Math.max(im.width,im.height));
  c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);var u=c.toDataURL("image/jpeg",.8);
  var ph=gal.children[cur].firstChild;ph.style.backgroundImage="url("+u+")";ph.textContent="";hearts(8);
  try{localStorage.setItem("nanu_p"+cur,u)}catch(e){}};im.src=r.result;};r.readAsDataURL(fl);fileIn.value="";};
yes.onclick=function(){
 $("mouth").setAttribute("d","M82 134 Q100 158 118 134");
 $("brow1").setAttribute("d","M62 84 Q73 76 84 84");
 $("brow2").setAttribute("d","M138 84 Q127 76 116 84");
 $("tear").style.display="none";
 $("title").innerHTML="Yaaay!! 🎉";
 msg.textContent="Thank you, "+HER_NAME+" ❤️ Tap to open your surprises 👇";
 $("btns").style.display="none";$("menu").style.display="grid";
 hearts(40);setInterval(function(){hearts(5)},1800);
 openP("p-letter");};
hearts(6);
</script>
</body>
</html>
